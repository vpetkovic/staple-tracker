name: CI

# Gates only. This workflow never publishes anything; publishing lives
# exclusively in release.yml and is reachable only via a v* tag ref.
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  gates:
    name: Gates + clean-machine drill
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node 22 (engines require >= 22.5)
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Worker dependencies
        run: npm ci --prefix worker

      # The browser suites (test/ui-*.test.ts) drive the built app in Chromium through
      # playwright-core, which brings no browser of its own. Without this they would skip; with
      # CI set they fail instead, so the gate never passes having pressed nothing.
      - name: Install Chromium for playwright-core
        run: npx playwright-core install --with-deps chromium

      - name: Build package
        run: npm run build:package

      - name: Typecheck
        run: npm run typecheck

      - name: Typecheck Worker
        run: npm run typecheck:worker

      - name: Unit tests
        run: env -u STAPLE_DB -u STAPLE_AGENT -u STAPLE_RUN -u STAPLE_RUN_TICKET HOME=$(mktemp -d) npm test

      - name: Worker tests
        run: env -u STAPLE_DB -u STAPLE_AGENT -u STAPLE_RUN -u STAPLE_RUN_TICKET HOME=$(mktemp -d) npm run test:worker

      - name: MCP smoke test
        run: npm run smoke:mcp

      # Builds dist-package itself, packs it, and installs the tarball into an
      # empty temp prefix with only node+npm on PATH. Exits nonzero on any
      # failure; writes nothing into the checkout.
      - name: Clean-machine npx drill
        run: npm run drill:npx

name: CI

# Gates only. This workflow never publishes anything; publishing lives
# exclusively in release.yml and is reachable only via a v* tag ref.
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  gates:
    name: Gates + clean-machine drill
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node 22 (engines require >= 22.5)
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Build the payload BEFORE the suite. `install-real-package` and
      # `install-schema-matrix` skip when `dist-package/` is absent, so without
      # this they ran only when `package-tarball` happened to build it first —
      # which is the race this step and the outDir change remove. Building here
      # makes them run every time instead of by accident.
      - name: Build the installable payload
        run: npm run build:package

      - name: Unit tests
        run: npm test

      - name: Typecheck
        run: npm run typecheck

      - name: MCP smoke test
        run: npm run smoke:mcp

      # Builds dist-package itself, packs it, and installs the tarball into an
      # empty temp prefix with only node+npm on PATH. Exits nonzero on any
      # failure; writes nothing into the checkout.
      - name: Clean-machine npx drill
        run: npm run drill:npx

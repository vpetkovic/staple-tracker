name: Site

# The website (site/, rendering docs/). Pull requests into any branch that touch
# the site or the docs get a build check; master deploys the site to GitHub Pages.
# A Cloudflare deploy (the `staple-site` Worker, static assets, site/wrangler.jsonc)
# sits beside it and skips until its secrets exist. The CLI gates live in ci.yml.
on:
  pull_request:
    # edited: a stacked PR retargeted to a new base gets checked again.
    types: [opened, synchronize, reopened, edited]
    paths:
      - "site/**"
      - "docs/**"
      # design/ and the root Markdown files are not rendered, but docs/ links to
      # them and the build fails when a link target is gone.
      - "design/**"
      - "*.md"
      - ".github/workflows/site.yml"
  push:
    branches: [master]
    paths:
      - "site/**"
      - "docs/**"
      - "design/**"
      - "*.md"
      - ".github/workflows/site.yml"
  # Deploys master on demand, e.g. after a Pages setting or a repository variable changes.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: site-${{ github.ref }}
  # A newer push supersedes a PR check; deploys finish in order.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: Build check
    if: github.event_name == 'pull_request' || github.ref != 'refs/heads/master'
    runs-on: ubuntu-latest
    steps:
      # Full history: the docs pages show the date of their last commit.
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          # No job pushes, so the GitHub token is not left in .git/config.
          persist-credentials: false

      - name: Setup Node 22
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Install site dependencies
        run: npm --prefix site ci

      # Throws on a broken link, anchor or Markdown link.
      - name: Build
        env:
          # Which landing page / serves (blend or bento); unset means blend.
          LANDING_VARIANT: ${{ vars.LANDING_VARIANT }}
        run: npm --prefix site run build

      # Checks site/wrangler.jsonc against the build output. Uploads nothing and
      # needs no credentials.
      - name: Validate the Worker config
        working-directory: site
        run: npx wrangler deploy --dry-run

  pages-build:
    name: Build for GitHub Pages
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    steps:
      # Full history: the docs pages show the date of their last commit.
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false

      # Reads the site's address from the Pages settings: the github.io origin and
      # /staple-tracker as the path, or a custom domain at its root once one is set.
      - name: Read the Pages settings
        id: pages
        uses: actions/configure-pages@v6

      - name: Setup Node 22
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Install site dependencies
        run: npm --prefix site ci

      - name: Build
        env:
          SITE_URL: ${{ steps.pages.outputs.origin }}
          BASE_URL: ${{ steps.pages.outputs.base_path }}
          LANDING_VARIANT: ${{ vars.LANDING_VARIANT }}
        run: npm --prefix site run build

      - name: Upload the site
        uses: actions/upload-pages-artifact@v5
        with:
          path: site/build

  pages-deploy:
    name: Deploy to GitHub Pages
    needs: pages-build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Deploy
        id: deploy
        uses: actions/deploy-pages@v5

  deploy:
    name: Deploy to Cloudflare
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    # The Cloudflare secrets are scoped to the steps that use them, so the install
    # and build steps' environment never holds them. The deploy step still runs
    # wrangler from the node_modules that install populated (the lockfile pins it).
    steps:
      - name: Check for Cloudflare credentials
        id: creds
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::notice title=Site deploy skipped::The CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID repository secrets are not both set. See \"Deploying the website\" in CONTRIBUTING.md."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      # vars.SITE_URL (the custom domain) wins; otherwise the Worker's workers.dev address.
      - name: Resolve the site URL
        id: url
        if: steps.creds.outputs.ready == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SITE_URL_VAR: ${{ vars.SITE_URL }}
        run: |
          if [ -n "$SITE_URL_VAR" ]; then
            url="${SITE_URL_VAR%/}"
          else
            subdomain="$(curl -fsS \
              -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/subdomain" \
              | jq -r '.result.subdomain // empty')" || subdomain=""
            if [ -z "$subdomain" ]; then
              echo "::error title=No site URL::Set the SITE_URL repository variable, or register a workers.dev subdomain for the account (the API token needs Workers Scripts read)."
              exit 1
            fi
            url="https://staple-site.$subdomain.workers.dev"
          fi
          echo "Site URL: $url"
          echo "site_url=$url" >> "$GITHUB_OUTPUT"

      - name: Checkout
        if: steps.creds.outputs.ready == 'true'
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          # No job pushes, so the GitHub token is not left in .git/config.
          persist-credentials: false

      - name: Setup Node 22
        if: steps.creds.outputs.ready == 'true'
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Install site dependencies
        if: steps.creds.outputs.ready == 'true'
        run: npm --prefix site ci

      - name: Build
        if: steps.creds.outputs.ready == 'true'
        env:
          SITE_URL: ${{ steps.url.outputs.site_url }}
          LANDING_VARIANT: ${{ vars.LANDING_VARIANT }}
        run: npm --prefix site run build

      - name: Deploy
        if: steps.creds.outputs.ready == 'true'
        working-directory: site
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy --message "master ${GITHUB_SHA::7}"

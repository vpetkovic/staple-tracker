<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!--
      The token arrives in this page's own URL and the page immediately scrubs it
      (see lib/api.ts). `no-referrer` makes sure that, in the window before the
      scrub, a link inside a rendered document cannot leak it in a Referer header.
    -->
    <meta name="referrer" content="no-referrer" />
    <title>staple</title>
    <script>
      // Paperclip's token sheet is class-driven (.dark), not media-query driven,
      // so the mode has to be applied before first paint or the page flashes light.
      (function () {
        try {
          var stored = localStorage.getItem("staple:theme");
          var dark = stored ? stored === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
          if (dark) document.documentElement.classList.add("dark");
        } catch (_) {
          /* private mode: fall through to light */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
